<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Browser Context Check</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>Browser Context Check <span id="mode" class="badge off">OFF</span></h1>
  <section>
    <dl class="kv">
      <dt>profile</dt><dd id="alias">—</dd>
      <dt>browser</dt><dd id="browser">—</dd>
      <dt>tabId</dt><dd id="tabId">—</dd>
      <dt>windowId</dt><dd id="windowId">—</dd>
    </dl>
  </section>
  <p id="pushError" class="status err" hidden></p>
  <button id="openOptions">設定を開く</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
